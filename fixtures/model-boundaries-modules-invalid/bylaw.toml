version = 1

[selectors.domain]
modules = ["model_boundaries_modules_invalid::domain::**"]

[selectors.persistence]
modules = ["model_boundaries_modules_invalid::persistence::**"]

[selectors.contract]
modules = ["model_boundaries_modules_invalid::contract::**"]

[selectors.api]
modules = ["model_boundaries_modules_invalid::api::**"]

[selectors.models]
modules = [
    "model_boundaries_modules_invalid::domain::**",
    "model_boundaries_modules_invalid::persistence::**",
    "model_boundaries_modules_invalid::contract::**",
    "model_boundaries_modules_invalid::api::**",
]

[[rule]]
id = "domain-is-internal"
kind = "forbid-dependencies"
from = "domain"
to = ["persistence", "contract", "api"]
scope = "actual"
[[rule]]
id = "persistence-does-not-use-contract"
kind = "forbid-dependencies"
from = "persistence"
to = ["contract", "api"]
scope = "actual"

[[rule]]
id = "api-does-not-use-persistence"
kind = "forbid-dependencies"
from = "api"
to = "persistence"
scope = "actual"

[[rule]]
id = "model-modules-are-acyclic"
kind = "no-cycles"
within = "models"
grouping = "modules"
scope = "actual"
