[workspace]
members = [
    "crates/bylaw",
    "crates/bylaw-analyzer",
    "crates/bylaw-config",
    "crates/bylaw-core",
    "crates/cargo-bylaw",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
readme = "README.md"
repository = "https://github.com/danielgerlag/cargo-bylaw"
homepage = "https://danielgerlag.github.io/cargo-bylaw/"
documentation = "https://danielgerlag.github.io/cargo-bylaw/"
keywords = ["architecture", "testing", "dependency", "cargo", "rust-analyzer"]
categories = ["development-tools", "development-tools::testing"]

[workspace.dependencies]
camino = { version = "1.2.5", features = ["serde1"] }
cargo_metadata = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
indexmap = { version = "2.14.0", features = ["serde"] }
petgraph = "0.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"
ra_ap_hir = "=0.0.347"
ra_ap_ide = "=0.0.347"
ra_ap_load-cargo = "=0.0.347"
ra_ap_project_model = "=0.0.347"
ra_ap_syntax = "=0.0.347"
ra_ap_vfs = "=0.0.347"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
