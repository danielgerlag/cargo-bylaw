name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path examples/model-boundaries/Cargo.toml --all --check
      - run: cargo fmt --manifest-path fixtures/model-boundaries-modules-valid/Cargo.toml --all --check
      - run: cargo fmt --manifest-path fixtures/model-boundaries-modules-invalid/Cargo.toml --all --check
      - run: cargo fmt --manifest-path fixtures/declared-dependency/Cargo.toml --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --manifest-path examples/model-boundaries/Cargo.toml
      - run: cargo run -p cargo-bylaw -- check --config examples/model-boundaries/bylaw.toml
      - run: cargo run -p cargo-bylaw -- check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo check --workspace
